<h1>Quartal voicings</h1>

<script>
/* ===== quartal engine ===== */
/* Direct port of the reference engine.py / symbols.py (briefs/). Pitch-class
   based, no hand-entered fingerings; headless — no DOM access in this block.
   Extracted and run by check.js and notation/pipeline/gen-quartal.js. */

const OPEN = [null,64,59,55,50,45,40];                 // MIDI of open string 1..6
const NOTES = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];   // chromatic, workbook flats
const PC = {C:0,Db:1,D:2,Eb:3,E:4,F:5,Gb:6,G:7,Ab:8,A:9,Bb:10,B:11};
const KEYS = ['C','F','Bb','Eb','Ab','Db','Gb','B','E','A','D','G'];    // cycle of 4ths
const SPELL = {C:["C","D","E","F","G","A","B"],F:["F","G","A","Bb","C","D","E"],Bb:["Bb","C","D","Eb","F","G","A"],Eb:["Eb","F","G","Ab","Bb","C","D"],Ab:["Ab","Bb","C","Db","Eb","F","G"],Db:["Db","Eb","F","Gb","Ab","Bb","C"],Gb:["Gb","Ab","Bb","Cb","Db","Eb","F"],B:["B","C#","D#","E","F#","G#","A#"],E:["E","F#","G#","A","B","C#","D#"],A:["A","B","C#","D","E","F#","G#"],D:["D","E","F#","G","A","B","C#"],G:["G","A","B","C","D","E","F#"]};
const MAJ = [0,2,4,5,7,9,11];
const LPC = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const ACCV = {'':0,'#':1,'##':2,'b':-1,'bb':-2};
const notePc = name => ((LPC[name[0]] + ACCV[name.slice(1)]) % 12 + 12) % 12;

/* families: diatonic step stacks (3 scale steps = a 4th, 2 = a 3rd) */
const FAMILIES = {
  q3:  { name:'3-note (4th–4th)',            steps:[3,3],     sets:[[5,4,3],[4,3,2],[3,2,1]], invs:[0,1,2] },
  q4:  { name:'4-note (4th–4th–4th)',        steps:[3,3,3],   sets:[[5,4,3,2],[4,3,2,1]],     invs:[0] },
  sw4: { name:'So What (4th–4th–3rd)',       steps:[3,3,2],   sets:[[4,3,2,1]],               invs:[0] },
  sw5: { name:'So What 5 (4th–4th–4th–3rd)', steps:[3,3,3,2], sets:[[5,4,3,2,1]],             invs:[0] },
};
const INV_NAMES = ['root position','1st inversion (4th–2nd)','2nd inversion (2nd–4th)'];  // workbook convention (D1)

function scale(tonicPc){ return MAJ.map(st => (tonicPc + st) % 12); }
function stack(sc, i, steps){
  const out = [sc[i]]; let j = i;
  for (const st of steps) { j = (j + st) % 7; out.push(sc[j]); }
  return out;
}
function invert(v, k){
  v = v.slice();
  for (let i = 0; i < k; i++) v.push(v.shift());
  return v;
}
const ivl = (a, b) => ((b - a) % 12 + 12) % 12;
const IVN = {5:'P4',6:'TT',2:'M2',1:'m2',4:'M3',3:'m3'};
function intervalType(pcs){
  const parts = [];
  for (let i = 0; i + 1 < pcs.length; i++) { const v = ivl(pcs[i], pcs[i+1]); parts.push(IVN[v] || String(v)); }
  return parts.join('/');
}
/* fret placements for pcs (low→high) on a string set (low→high): both octave
   positions in 0..ceil, span <= 4, ascending by lowest fret (engine.py place) */
function place(pcs, strings, ceil = 15){
  const cands = pcs.map((pc, i) => {
    const base = ((pc - OPEN[strings[i]]) % 12 + 12) % 12;
    return [base, base + 12].filter(f => f <= ceil);
  });
  const out = [];
  (function walk(i, acc){
    if (i === pcs.length) { if (Math.max(...acc) - Math.min(...acc) <= 4) out.push(acc.slice()); return; }
    for (const f of cands[i]) { acc.push(f); walk(i + 1, acc); acc.pop(); }
  })(0, []);
  out.sort((a, b) => Math.min(...a) - Math.min(...b));
  return out;
}
function spellPc(pc, parentKey){
  const i = scale(PC[parentKey]).indexOf(pc);
  return i >= 0 ? SPELL[parentKey][i] : NOTES[pc];
}
/* the full catalogue walk for one parent key / family / string set / inversion:
   every degree's placements, flattened, ascending by lowest fret (8va copies kept) */
function walkCards(parentKey, family, strings, inv){
  const sc = scale(PC[parentKey]), fam = FAMILIES[family];
  const cards = [];
  for (let d = 0; d < 7; d++) {
    const root = stack(sc, d, fam.steps);
    const pcs = invert(root, inv);
    place(pcs, strings).forEach((frets, pi) => cards.push({
      d, root, pcs, frets, strings, inv, family, oct: pi > 0,
      names: pcs.map(p => spellPc(p, parentKey)),
      itype: intervalType(pcs), tt: /TT|m2/.test(intervalType(pcs)),
    }));
  }
  cards.sort((a, b) => Math.min(...a.frets) - Math.min(...b.frets)
    || (OPEN[a.strings[0]] + a.frets[0]) - (OPEN[b.strings[0]] + b.frets[0]));
  return cards;
}

/* ---------- chord symbols: port of symbols.py, rules in order ---------- */
const SYM_ALT = {1:'♭9',3:'♯9',6:'♭5',8:'♭13'};
function label(bass, pcs){
  const d = new Set(pcs.map(p => ((p - bass) % 12 + 12) % 12)); d.delete(0);
  const b9=d.has(1), n9=d.has(2), s9=d.has(3), M3=d.has(4), p11=d.has(5), b5=d.has(6),
        p5=d.has(7), b13=d.has(8), s13=d.has(9), b7=d.has(10), M7=d.has(11);
  const m3 = s9;
  if (b7 && M7) return '—';
  if (b9 && n9) return '—';
  if (M3 && m3 && !b7) { if (s13) return 'Δ13(♯9)'; return '—'; }
  const alts = [1,3,6,8].filter(x => d.has(x));
  const nats = [2,5,7,9].filter(x => d.has(x));
  if (M3 && b7) {                                          // dominant / altered
    if (p11 && !alts.length && !n9 && !s13) return '7sus';
    if (alts.length && !nats.length) return alts.length >= 2 ? '7alt.' : '7(' + SYM_ALT[alts[0]] + ')';
    if (alts.length) {
      const names = Object.assign({}, SYM_ALT);
      if (p5) names[6] = '♯11';
      const base = s13 ? '13' : (n9 ? '9' : '7');
      return base + '(' + alts.map(x => names[x]).join('') + ')';
    }
    if (s13) return '13';
    if (n9) return '9';
    return '7';
  }
  if (alts.length && !nats.length && !M3 && !b7 && !M7 && alts.length >= 3) return '7alt.';
  if (M3) {                                                // major without b7
    if (M7) {
      if (b9 && b5) return 'Δ7(♭9♭5)';
      if (b9) return '—';
      if (s13) return 'Δ13';
      if (b5) return 'Δ7(♯11)';
      if (p11) return 'Δ7(sus4)';
      if (n9) return 'Δ9';
      return 'Δ7';
    }
    if (s13 && n9) return '6/9';
    if (b13 && s13) return 'Δ7(♯5)';
    if (b13 && n9) return 'Δ7(♯5)';
    if (b5 && M7) return 'Δ7(♯11)';                        // unreachable; kept for the port
    if (b5) return 'Δ7(♯11)';
    if (s13) return '6';
    if (n9) return 'Δ9';
    return '—';
  }
  if (m3 && !M3) {                                         // minor family
    if (b9) return '—';
    if (b5) {
      if (b7) return p11 ? 'ø11' : 'ø7';
      if (s13 && b13) return '°7(♭13)';
      if (s13) return '°7';
      if (p11) return 'ø11';
      if (b13) return 'ø(♭13)';
      return 'ø';
    }
    if (b7) {
      if (s13) return 'm13';
      if (b13) return 'm7(♭6)';
      if (p11) return 'm11';
      if (n9) return 'm9';
      return 'm7';
    }
    if (M7) return p11 ? 'm(Δ11)' : (n9 ? 'm(Δ9)' : 'm(Δ7)');
    if (s13 && b13) return '°7(♭13)';
    if (s13 && n9) return 'm6/9';
    if (s13) return 'm6';
    if (b13 && n9) return 'm9(♭6)';
    if (b13) return 'm(♭6)';
    if (p11 && n9) return 'm(9,11)';
    return '—';
  }
  // no third
  if (M7 && b9 && b5) return 'Δ7(♭9♭5)';
  if (b13 && n9 && s13) return 'Δ7(♯5)';
  if (b13 && n9 && !b7) return 'm9(♭6)';
  if (b13 && b7) return 'm7(♭6)';
  if (b5 && p11 && !M7) return 'ø11';
  if (b7 && (p11 || p5)) return n9 ? '9sus' : '7sus';
  if (M7 && b5 && p11) return 'Δ7(♭5sus4)';
  if (M7 && p11) return 'm(Δ11)';
  if (M7 && b5) return 'Δ7(♯11)';
  if (M7 && s13) return 'Δ13';
  if (M7 && n9) return 'Δ9';
  if (p11 && p5) return '7sus';
  if (b9 && p5 && b5) return '7(♭9♯11)';
  if (b9 && p5) return b13 ? '7(♭9♭13)' : '7(♭9)';
  if (b9 && b5) return '7(♭9♭5)';
  if (s13 && n9) return '6/9';
  if (n9 && p5) return 'Δ9';
  if (b5 && p5) return 'Δ7(♯11)';
  if (b5) return 'Δ7(♯11)';
  return '—';
}
/* Ex. 5/10/11 table: one shape, bass descending chromatically from E */
const BASS_ORDER = Array.from({length: 12}, (_, k) => ((4 - k) % 12 + 12) % 12);   // E Eb D Db C B Bb A Ab G Gb F
function symTable(pcs){ return BASS_ORDER.map(b => ({ bass: b, name: NOTES[b], sym: label(b, pcs) })); }

/* degree names: dual (Appendix B style) and contextual (§6.3 / reading lines) */
const DUAL = {0:'1',1:'♭9',2:'9',3:'♭3/♯9',4:'3',5:'11',6:'♭5/♯11',7:'5',8:'♭13',9:'13/6',10:'♭7',11:'Δ7'};
function nameDeg(off, sym){
  sym = sym || '';
  const minor = /^(m(?!aj)|ø|°)/.test(sym);
  const six = /^6/.test(sym) || /^m6/.test(sym);
  const altish = /alt|ø|°|♭5/.test(sym);
  return {0:'1',1:'♭9',2:'9',3:minor?'♭3':'♯9',4:'3',5:'11',
          6:altish?'♭5':'♯11',7:'5',8:/♯5/.test(sym)?'♯5':'♭13',
          9:six?'6':'13',10:'♭7',11:'Δ7'}[off];
}
/* spell a chord tone from its degree against the symbol root (workbook style:
   ♯9 takes the practical ♭3 letter — D7alt. is spelled B♭ E♭ F, not E♯) */
const DEG_LETTER = {'1':0,'♭9':1,'9':1,'♯9':2,'♭3':2,'3':2,'11':3,'♯11':3,'♭5':4,'5':4,'♯5':4,'♭13':5,'13':5,'6':5,'♭7':6,'Δ7':6};
function spellDeg(pc, rootName, sym){
  const off = ((pc - notePc(rootName)) % 12 + 12) % 12;
  const li = 'CDEFGAB'.indexOf(rootName[0]) , lo = DEG_LETTER[nameDeg(off, sym)];
  const letter = 'CDEFGAB'[(li + lo) % 7];
  let acc = ((pc - LPC[letter]) % 12 + 12) % 12; if (acc > 6) acc -= 12;
  return letter + (acc > 0 ? '#'.repeat(acc) : 'b'.repeat(-acc));
}

/* ---------- guideposts: "to sound like X, the top note must be Y" ---------- */
const CONSTR = {'P4/P4':[0,5,10], 'P4/TT':[0,5,11], 'TT/P4':[0,6,11]};
/* derive rows for one construction (pcs = its root-position stack anywhere):
   group the 12 basses by symbol; per inversion, the top note's contextual degree */
function guideposts(pcs, only){
  const rows = [], seen = new Map();
  for (const { bass, sym } of symTable(pcs)) {
    if (sym === '—') continue;
    if (!seen.has(sym)) { seen.set(sym, { sym, tops: [[],[],[]] }); rows.push(seen.get(sym)); }
    const r = seen.get(sym);
    for (const k of [0,1,2]) {
      const top = invert(pcs, k)[pcs.length - 1];
      const deg = nameDeg(((top - bass) % 12 + 12) % 12, sym);
      if (!r.tops[k].includes(deg)) r.tops[k].push(deg);
    }
  }
  if (only) return only.map(s => rows.find(r => r.sym === s)).filter(Boolean);
  return rows;
}
const GP_CANON = ['m11','7alt.','6/9','Δ13','Δ7(♯11)','7sus'];    // §6.3's six, for P4/P4

/* ---------- bass placement (Function tab, transposed presets) ----------
   6th string at the octave nearest the shape's lowest fret; 5th string when
   that fret leaves 0..15 (the workbook uses both) */
function bassPlace(pc, anchor){
  for (const s of [6, 5]) {
    const base = ((pc - OPEN[s]) % 12 + 12) % 12;
    const f = base + 12 * Math.round((anchor - base) / 12);
    if (f >= 0 && f <= 15) return { s, f };
  }
  return { s: 6, f: ((pc - OPEN[6]) % 12 + 12) % 12 };
}

/* ---------- progressions ---------- */
/* find a q3 voicing sounding as `target` over `bassPc`, at `inv`, on `strings`,
   nearest the previous placement (Voice-Leading Trainer's cost: top-note
   motion first, then hand travel) */
function funcSearch(target, bassPc, inv, strings, prev){
  const opts = [];
  for (const cn of Object.keys(CONSTR)) for (let o = 0; o < 12; o++) {
    const root = CONSTR[cn].map(x => (bassPc + o + x) % 12);
    if (label(bassPc, root) !== target) continue;
    const pcs = invert(root, inv);
    for (const frets of place(pcs, strings)) opts.push({ pcs, root, frets, strings, inv });
  }
  const top = p => OPEN[p.strings[p.strings.length - 1]] + p.frets[p.frets.length - 1];
  const anchor = p => Math.min(...p.frets);
  const cost = p => prev ? Math.abs(top(p) - top(prev)) + Math.abs(anchor(p) - anchor(prev)) * 0.25
                         : Math.abs(anchor(p) - 5) * 0.2 + anchor(p) * 0.05;
  opts.sort((a, b) => cost(a) - cost(b));
  return opts[0] || null;
}
/* the eleven workbook ii–V–I sets (§7.1), transcribed. strings low→high;
   basses in home keys are the workbook's where printed, else bassPlace() —
   8a/8b reuse 6b/6c's printed basses for the shared voicings; 8c/8h had none. */
const PRESETS = [

/* transpose a preset to a key: same strings, frets shifted by the nearest
   direction; a chord that leaves 0..15 tries the other octave, and if none
   fits it drops an octave and flags (console) — acceptance §8.4 */
function transposePreset(preset, key){
  const d0 = ((PC[key] - PC[preset.key]) % 12 + 12) % 12;
  const delta = d0 > 6 ? d0 - 12 : d0;
  const flags = [];
  const chords = preset.chords.map(ch => {
    if (!delta) return Object.assign({}, ch, { flag: null });
    const fit = fs => fs.every(f => f >= 0 && f <= 15);
    let frets = ch.frets.map(f => f + delta), flag = null;
    if (!fit(frets)) {
      const alt = [12, -12].map(sh => ch.frets.map(f => f + delta + sh)).find(fit);
      if (alt) frets = alt;
      else { const over = Math.max(...frets) > 15; frets = frets.map(f => f + (over ? -12 : 12)); flag = 'no in-range octave; shifted an octave and clipped'; }
    }
    const rootPc = (notePc(ch.root) + d0) % 12;
    const rootName = spellPc(rootPc, key);
    const sym = rootName + ch.sym.slice(ch.root.length);
    const pcs = ch.strings.map((s, i) => (OPEN[s] + frets[i]) % 12);
    const notes = pcs.map(p => spellDeg(p, rootName, ch.sym.slice(ch.root.length)));
    const bassPc = (notePc(ch.bass.name) + d0) % 12;
    const bass = Object.assign({ name: spellDeg(bassPc, rootName, ch.sym.slice(ch.root.length)) }, bassPlace(bassPc, Math.min(...frets)));

/* recognize a played q3 voicing: which construction, which inversion, what root form */
function classify(pcs){
  for (const cn of Object.keys(CONSTR)) for (let k = 0; k < pcs.length; k++) {
    const root = invert(pcs, (pcs.length - k) % pcs.length);
    const rel = root.map(p => ((p - root[0]) % 12 + 12) % 12);
    if (rel.join(',') === CONSTR[cn].join(',')) return { cn, inv: k, root };
  }
  return null;
}
/* the generated one-line reading (§3.5): root form + inversion, then each
   played note's degree over the symbol root, top first */
function readingLine(ch){
  const pcs = ch.strings.map((s, i) => (OPEN[s] + ch.frets[i]) % 12);
  const cls = classify(pcs);
  const suffix = ch.sym.slice(ch.root.length);
  const rootNames = cls ? invert(ch.notes, ((pcs.length - cls.inv) % pcs.length)) : ch.notes;
  const posName = cls ? INV_NAMES[cls.inv] : '';
  const rootPc = notePc(ch.root);
  const byPitch = ch.strings.map((s, i) => ({ name: ch.notes[i], midi: OPEN[s] + ch.frets[i], pc: pcs[i] }))
    .sort((a, b) => b.midi - a.midi);
  const degs = byPitch.map((n, i) => (i === 0 ? 'the top ' : '') + disp(n.name) + (i === 0 ? ' is the ' : ' the ') + nameDeg(((n.pc - rootPc) % 12 + 12) % 12, suffix));
  return rootNames.map(disp).join('–') + ' ' + posName + ': over ' + disp(ch.root) + ', ' + degs.join(', ') + '.';
}
function disp(name){ return name[0] + name.slice(1).replace(/b/g, '♭').replace(/#/g, '♯'); }

    const suffix = ch.sym.slice(ch.root.length);
    ok(label(notePc(ch.root), pcs) === suffix, `${p.id} ${ch.sym}: label() says ${label(notePc(ch.root), pcs)}`);
    ok(!!classify(pcs), `${p.id} ${ch.sym}: not a recognizable quartal stack`);
    ok((OPEN[ch.bass.s] + ch.bass.f) % 12 === notePc(ch.bass.name), `${p.id} ${ch.sym}: bass fret isn't ${ch.bass.name}`);
  }
  // planing examples land where the workbook says
  for (const id of ['8b','8h']) {
    const p = PRESETS.find(x => x.id === id);
    const planed = planeChord(p.chords[1], p.plane, p.chords[2].root);
    ok(planed.frets.join(',') === p.chords[2].frets.join(','), `${id}: planing lands on ${planed.frets}, workbook has ${p.chords[2].frets}`);
    ok(planed.sym === p.chords[2].sym, `${id}: planed symbol ${planed.sym}, workbook ${p.chords[2].sym}`);
  }
  // presets transpose to all keys without leaving frets 0..15 (§8.4)
  for (const p of PRESETS) for (const key of KEYS) {
    const t = transposePreset(p, key);
    for (const ch of t.chords) ok(ch.frets.every(f => f >= 0 && f <= 15), `${p.id} in ${key}: ${ch.sym} at ${ch.frets}`);
    for (const ch of t.chords) {
      const pcs = ch.strings.map((s, i) => (OPEN[s] + ch.frets[i]) % 12);
      ok(label((notePc(ch.root)) % 12, pcs) === ch.sym.slice(ch.root.length), `${p.id} in ${key}: ${ch.sym} mislabeled`);
    }
  }
  // §8 tunes: every voicing sounds its notes, labels reproduce (bar 8 of Stella = A♭13, D17), basses land
  for (const tid of Object.keys(TUNES)) for (const row of TUNES[tid].rows) for (const ch of row.chords) {
    const pcs = ch.strings.map((s, i) => (OPEN[s] + ch.frets[i]) % 12);
    ok(pcs.every((pc, i) => pc === notePc(ch.notes[i])), `${tid} bar ${row.bar} ${ch.sym}: frets don't sound the written notes`);
    ok(label(notePc(ch.root), pcs) === ch.sym.slice(ch.root.length),
      `${tid} bar ${row.bar} ${ch.sym}: label() says ${label(notePc(ch.root), pcs)}`);
    ok((OPEN[ch.bass.s] + ch.bass.f) % 12 === notePc(ch.bass.name), `${tid} bar ${row.bar} ${ch.sym}: bass fret isn't ${ch.bass.name}`);
    ok(Math.max(...ch.frets.filter(f => f > 0)) - Math.min(...ch.frets.filter(f => f > 0)) <= 4 || ch.frets.includes(0),
      `${tid} bar ${row.bar} ${ch.sym}: span over 4`);
  }
  ok(TUNES.stella.rows.find(r => r.bar === 8).chords.every(c => c.sym === 'Ab13'), 'Stella bar 8 must read Ab13 (D17)');
  ok(TUNES.stella.rows.find(r => r.bar === 12).chords[1].strings.join('') === '321', 'Stella bar 12b on 3-2-1');
  ok(TUNES.stella.rows.find(r => r.bar === 19).chords[0].strings.join('') === '321', 'Stella bars 19–20 on 3-2-1');
  return { pass, fail, msgs };
}
/* ===== end quartal engine ===== */
</script>
