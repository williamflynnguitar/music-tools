<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inversion Drill</title>
<style>
:root{
  --ink:#0b1a1f; --petrol:#123640; --petrol-2:#1a4551; --line:#2a5461;
  --bone:#e8e1d1; --bone-dim:#a89f8c; --brass:#c9a24a;
  --good:#7fb28a; --bad:#d4715f;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--serif);font-size:16px;line-height:1.5}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:22px 28px 0;flex-wrap:wrap}
.wordmark{font-size:28px;font-weight:400;margin:0}
.wordmark em{font-style:italic;color:var(--brass)}
.modes{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.modes button{background:transparent;border:0;padding:6px 14px;cursor:pointer;color:var(--bone-dim)}
.modes button[aria-pressed=true]{background:var(--petrol-2);color:var(--bone)}

.app{display:grid;grid-template-columns:290px 1fr;padding:18px 28px 40px;gap:0}
@media (max-width:900px){.app{grid-template-columns:1fr;gap:24px}}
.controls{padding-right:26px}
.group{margin-bottom:18px}
.group .lbl{display:block;font-size:14px;color:var(--bone-dim);margin-bottom:6px}
.roots{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.roots button,.seg button{background:transparent;border:1px solid var(--line);border-radius:3px;padding:6px 4px;cursor:pointer;font-family:var(--mono);font-size:13px}
.roots button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.seg{display:grid;gap:4px;grid-template-columns:1fr 1fr}
.seg.three{grid-template-columns:1fr 1fr 1fr}
select{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:7px 10px;color:var(--bone)}
.sets{display:flex;flex-direction:column;gap:4px}
.sets button{text-align:left;background:transparent;border:1px solid var(--line);border-radius:3px;padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;font-size:14px}
.sets button small{font-family:var(--mono);color:var(--bone-dim);font-size:11px}
.sets button[aria-pressed=true]{border-color:var(--brass);background:var(--petrol-2)}
.sets button[aria-pressed=true] small{color:var(--brass)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--bone-dim);cursor:pointer;margin-top:6px}
.check input{accent-color:var(--brass)}

.stage{padding:0 10px}
.title{font-family:var(--mono);font-size:22px;margin:0 0 4px}
.title .q{color:var(--brass);font-size:.6em;vertical-align:.5em}
.sub{color:var(--bone-dim);font-size:14px;margin:0 0 16px;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:10px}
.card{border:1px solid var(--line);border-radius:4px;padding:10px 8px 6px;text-align:center;cursor:pointer;background:transparent;color:var(--bone);width:164px}
.card:hover{border-color:var(--brass)}
.card .nm{font-family:var(--mono);font-size:15px;line-height:1.1}
.card .nm .q{color:var(--brass);font-size:.7em;vertical-align:.4em}
.card .tag{font-size:12px;color:var(--bone-dim);margin-top:2px;line-height:1.3}
.card svg{display:block;margin:4px auto 0}
.card.rn .nm{font-size:13px}
.hint{font-size:13px;color:var(--bone-dim);margin-top:16px;max-width:60ch}

/* quiz */
.quiz{display:none;flex-direction:column;align-items:flex-start;gap:12px}
body.quiz-on .quiz{display:flex}
body.quiz-on .study{display:none}
.quiz .big{width:auto;padding:12px 18px 8px}
.quiz .qtext{font-size:18px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(150px,200px));gap:8px}
.choices button{background:transparent;border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-family:var(--mono);font-size:16px;cursor:pointer;color:var(--bone)}
.choices button:hover{border-color:var(--brass)}
.choices button.right{border-color:var(--good);color:var(--good)}
.choices button.wrong{border-color:var(--bad);color:var(--bad)}
.score{font-family:var(--mono);font-size:14px;color:var(--bone-dim)}
.btn{background:var(--brass);color:var(--ink);border:0;border-radius:4px;padding:8px 16px;cursor:pointer}
.btn.quiet{background:transparent;color:var(--bone);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="top">
  <h1 class="wordmark">Inversion <em>Drill</em></h1>
  <div class="modes" role="group" aria-label="Mode">
    <button id="mStudy" aria-pressed="true">One chord</button>
    <button id="mKey" aria-pressed="false">Through a key</button>
    <button id="mQuiz" aria-pressed="false">Drill</button>
  </div>
</div>

<div class="app">
<aside class="controls">
  <div class="group">
    <span class="lbl" id="rootLbl">Root</span>
    <div class="roots" id="roots"></div>
  </div>
  <div class="group study-ctl">
    <label class="lbl" for="quality">Quality</label>
    <select id="quality"></select>
  </div>
  <div class="group key-ctl" style="display:none">
    <label class="lbl" for="scale">Tonality</label>
    <select id="scale">
      <option value="major">Major</option>
      <option value="harm">Harmonic minor</option>
      <option value="mel">Melodic minor</option>
    </select>
  </div>
  <div class="group key-ctl" style="display:none">
    <span class="lbl">Inversion to hold</span>
    <div class="seg" id="invPick">
      <button data-v="0" aria-pressed="true">root pos</button><button data-v="1" aria-pressed="false">1st</button>
      <button data-v="2" aria-pressed="false">2nd</button><button data-v="3" aria-pressed="false">3rd</button>
    </div>
  </div>
  <div class="group">
    <span class="lbl">Voicing and string set</span>
    <div class="sets" id="sets"></div>
    <label class="check quiz-ctl" style="display:none"><input type="checkbox" id="anySet"> drill across all string sets</label>
  </div>
  <div class="group">
    <label class="check"><input type="checkbox" id="labels" checked> chord tones in the dots</label>
    <label class="check"><input type="checkbox" id="sound" checked> play on click</label>
    <button class="btn quiet" id="lily" style="margin-top:12px" title="what's on screen, as notation + TAB in a LilyPond file">Download .ly</button>
  </div>
</aside>

<main class="stage">
  <div class="study">
    <h2 class="title" id="title"></h2>
    <p class="sub" id="sub"></p>
    <div class="row" id="row"></div>
    <p class="hint" id="hint"></p>
  </div>
  <div class="quiz">
    <h2 class="title" id="qTitle"></h2>
    <p class="sub" id="qText"></p>
    <div id="qDia"></div>
    <div class="choices" id="choices"></div>
    <div class="score" id="score">Streak 0</div>
    <button class="btn" id="next">Next</button>
  </div>
</main>
</div>

<script>
/* ---------- engine ---------- */
const OPEN = [null,64,59,55,50,45,40];
const ROOTS = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const DEG = {R:0,b9:1,'9':2,b3:3,'3':4,'11':5,b5:6,'#11':6,'5':7,'#5':8,b13:8,'6':9,bb7:9,b7:10,'7':11};
const QUAL = {
  maj7 :{name:'Major 7',        sym:'Δ7',   tones:['R','3','5','7']},
  m7   :{name:'Minor 7',        sym:'-7',   tones:['R','b3','5','b7']},
  '7'  :{name:'Dominant 7',     sym:'7',    tones:['R','3','5','b7']},
  '6'  :{name:'Major 6',        sym:'6',    tones:['R','3','5','6']},
  m6   :{name:'Minor 6',        sym:'-6',   tones:['R','b3','5','6']},
  mMaj7:{name:'Minor-major 7',  sym:'-Δ7',  tones:['R','b3','5','7']},
  m7b5 :{name:'Half-diminished',sym:'ø7',   tones:['R','b3','b5','b7']},
  dim7 :{name:'Diminished 7',   sym:'°7',   tones:['R','b3','b5','bb7']},
  maj7s5:{name:'Augmented major 7',sym:'Δ7#5',tones:['R','3','#5','7']},
};
const SETS = [
  {id:'d2top', kind:'drop2', name:'Drop-2, top set',    strings:[4,3,2,1], tag:'D G B E'},
  {id:'d2mid', kind:'drop2', name:'Drop-2, middle set', strings:[5,4,3,2], tag:'A D G B'},
  {id:'d2bot', kind:'drop2', name:'Drop-2, bottom set', strings:[6,5,4,3], tag:'E A D G'},
  {id:'d3low', kind:'drop3', name:'Drop-3, lower set',  strings:[6,4,3,2], tag:'E · D G B'},
  {id:'d3up',  kind:'drop3', name:'Drop-3, upper set',  strings:[5,3,2,1], tag:'A · G B E'},
];
const INV = ['root position','1st inversion','2nd inversion','3rd inversion'];

/* realize inversion `inv` of chord (pc, quality) on a string set; returns list of positions up the neck */
function realize(pc, qKey, set, inv){
  const tones = QUAL[qKey].tones;
  const rot = [0,1,2,3].map(i=>(i+inv)%4);                 // close voicing bottom→top
  const order = set.kind==='drop2' ? [rot[2],rot[0],rot[1],rot[3]] : [rot[1],rot[0],rot[2],rot[3]];
  const pcs = order.map(i=>(pc+DEG[tones[i]])%12);
  const out = [];
  const s0 = set.strings[0];
  for(let f0=1; f0<=15; f0++){
    if((OPEN[s0]+f0)%12 !== pcs[0]) continue;
    let prev = OPEN[s0]+f0, ok = true;
    const notes = [{s:s0, f:f0, deg:tones[order[0]]}];
    set.strings.slice(1).forEach((s,j)=>{
      let p = prev+1; while(p%12 !== pcs[j+1]) p++;
      const fr = p-OPEN[s]; if(fr<1||fr>17) ok=false;
      notes.push({s, f:fr, deg:tones[order[j+1]]}); prev=p;
    });
    if(!ok) continue;
    const fs = notes.map(n=>n.f);
    const span = Math.max(...fs)-Math.min(...fs);
    if(span > 5) continue;
    out.push({notes, inv, bassFret:f0, low:Math.min(...fs), top:tones[order[3]], bass:tones[order[0]], span});
  }
  return out;
}

/* ---------- scales / key study ---------- */
const SCALES = {major:[0,2,4,5,7,9,11], harm:[0,2,3,5,7,8,11], mel:[0,2,3,5,7,9,11]};
const MAJOR_RN = ['I','II','III','IV','V','VI','VII'];
function diatonic(tonicPc, scaleKey){
  const sc = SCALES[scaleKey];
  return sc.map((d,i)=>{
    const iv = k => ((sc[(i+k)%7]-d)%12+12)%12;
    const third=iv(2), fifth=iv(4), seventh=iv(6);
    let q = Object.keys(QUAL).find(k=>{ const t=QUAL[k].tones; return DEG[t[1]]===third && DEG[t[2]]===fifth && DEG[t[3]]===seventh; });
    if(!q) q = 'maj7';
    const majDeg = SCALES.major[i];
    const acc = d===majDeg ? '' : (d===(majDeg+11)%12 ? 'b' : '#');
    const lower = QUAL[q].tones[1]==='b3';
    const rn = acc + (lower ? MAJOR_RN[i].toLowerCase() : MAJOR_RN[i]);
    return {pc:(tonicPc+d)%12, q, rn};
  });
}
function spell(pc, tonicPc, scaleKey){
  const flatKeys = [0,1,3,5,8,10]; // C F Bb Eb Ab Db use flats; others sharps
  const useFlat = scaleKey==='major' ? flatKeys.includes(tonicPc) : [0,2,3,5,7,8,10].includes(tonicPc);
  return useFlat ? ROOTS[pc] : SHARP[pc];
}

/* ---------- audio ---------- */
let ac = null;
function strum(notes){
  if(!document.getElementById('sound').checked) return;
  ac = ac || new (window.AudioContext||window.webkitAudioContext)();
  const t0 = ac.currentTime + 0.02;
  [...notes].sort((a,b)=>b.s-a.s).forEach((n,i)=>{
    const midi = OPEN[n.s]+n.f, f = 440*Math.pow(2,(midi-69)/12);
    const o = ac.createOscillator(), g = ac.createGain(), o2 = ac.createOscillator(), g2 = ac.createGain();
    o.type='triangle'; o.frequency.value=f; o2.type='sine'; o2.frequency.value=f*2; g2.gain.value=.25;
    const t = t0 + i*0.045;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.008); g.gain.exponentialRampToValueAtTime(.0008,t+2.2);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(ac.destination);
    o.start(t); o2.start(t); o.stop(t+2.3); o2.stop(t+2.3);
  });
}

/* ---------- diagram ---------- */
function diagram(v, showLabels, W){
  W = W||150; const sx=W/8.2, x0=sx*1.4, fy=sx*1.15, y0=fy*.9, nF=5, H=y0+nF*fy+fy*.7;
  const fs = v.notes.map(n=>n.f); const minF=Math.min(...fs), maxF=Math.max(...fs);
  let base = minF<=1 ? 1 : minF; if(maxF-base+1>nF) base = maxF-nF+1;
  const used = new Set(v.notes.map(n=>n.s));
  let o=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Menlo,Consolas,monospace">`;
  for(let s=6;s>=1;s--){ const x=x0+(6-s)*sx; o+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0+nF*fy}" stroke="#a89f8c" stroke-width="${s>=5?1.4:1}"/>`; }
  for(let i=0;i<=nF;i++){ const y=y0+i*fy; o+=`<line x1="${x0}" y1="${y}" x2="${x0+5*sx}" y2="${y}" stroke="#a89f8c" stroke-width="${i===0&&base===1?4:1}"/>`; }
  if(base>1) o+=`<text x="${x0-sx*.35}" y="${y0+fy/2+4}" font-size="${sx*.6}" text-anchor="end" fill="#6f8a92">${base}</text>`;
  for(let s=6;s>=1;s--){ const x=x0+(6-s)*sx; if(!used.has(s)) o+=`<text x="${x}" y="${y0-fy*.3}" font-size="${sx*.65}" text-anchor="middle" fill="#6f8a92">×</text>`; }
  v.notes.forEach(n=>{ const x=x0+(6-n.s)*sx, y=y0+(n.f-base)*fy+fy/2;
    o+=`<circle cx="${x}" cy="${y}" r="${sx*.42}" fill="${n===v.notes[3]?'#c9a24a':'#e8e1d1'}"/>`;
    if(showLabels) o+=`<text x="${x}" y="${y+sx*.16}" font-size="${sx*.42}" text-anchor="middle" fill="#0b1a1f">${n.deg}</text>`; });
  return o+'</svg>';
}
function fmt(root, sym){ return root + '<span class="q">' + sym + '</span>'; }

/* ---------- LilyPond export (shared; keep in sync across apps) ----------
   Produces a .ly file following Argue's Music Preparation Fundamentals:
   part name top left, source top right, title centered, 0.5in margins,
   measure number under every bar, metronome mark before the style word,
   double bar at section ends, guitar on treble_8 clef with TAB beneath. */
const LY_Q = {maj7:'maj7','6':'6','7':'7',sus7:'7sus4',m7:'m7',m6:'m6',m7b5:'m7.5-',dim7:'dim7',mMaj7:'m7+',maj7s5:'maj7.5+'};
const LY_EXT = {'9':'9',b9:'9-','#9':'9+','11':'11','#11':'11+','13':'13',b13:'13-',b5:'5-','#5':'5+'};
const LY_ROOT = {C:'c',D:'d',E:'e',F:'f',G:'g',A:'a',B:'b'};
function lyRoot(rootName){ const l=LY_ROOT[rootName[0]]; const a=rootName.slice(1); return l+(a==='b'?(l==='a'||l==='e'?'es':'es'):(a==='#'?'is':'')); }
function lyPitch(midi, flats){
  const names = flats ? ['c','des','d','ees','e','f','ges','g','aes','a','bes','b'] : ['c','cis','d','dis','e','f','fis','g','gis','a','ais','b'];
  const oct = Math.floor(midi/12)-1;
  return names[midi%12] + (oct>=4 ? "'".repeat(oct-3) : ",".repeat(3-oct));
}
function lyChordName(ch, dur){
  const allowed = [];
  const ext = (ch.ext||[]).filter(e=>allowed.includes(e) && LY_EXT[e]).map(e=>'.'+LY_EXT[e]).join('');
  return lyRoot(ch.rootName)+dur+':'+LY_Q[ch.quality]+ext;
}
function lyVoicing(v, ch, dur){
  const flats = !/#/.test(ch.rootName);
  const ns = [...v.notes].sort((a,b)=>b.s-a.s).map(n=>lyPitch(OPEN[n.s]+n.f, flats)+'\\'+n.s);
  return '<'+ns.join(' ')+'>'+dur;
}
function lyFret(v){
  const by = {}; v.notes.forEach(n=>by[n.s]=n.f);
  const items = [];
  for(let s=6;s>=1;s--){ if(by[s]===undefined) items.push('(mute '+s+')'); else if(by[s]===0) items.push('(open '+s+')'); else items.push('(place-fret '+s+' '+by[s]+')'); }
  return "\\markup \\override #'(size . 1.4) \\fret-diagram-verbose #'("+items.join(' ')+')';
}
/* bars: [[{ch, v}], ...]; opts: {title, part, source, style, bpm, chart:true → slash notation + fret diagrams instead of voicings} */
function lyDocument(bars, opts){
  const chords=[], music=[], rhythm=[];
  bars.forEach((bar,i)=>{
    const d = bar.length===2 ? '2' : (bar.length===4 ? '4' : '1');
    const cn=[], mu=[], rh=[];
    bar.forEach((it,j)=>{
      if(!it.ch){ cn.push('r'+d); mu.push('r'+d); rh.push('r'+d); return; }
      cn.push(lyChordName(it.ch, d));
      mu.push(it.v ? lyVoicing(it.v, it.ch, d) : 'r'+d);
      const slashes = bar.length===2 ? "b'4 b'4" : (bar.length===4 ? "b'4" : "b'4 b'4 b'4 b'4");
      rh.push(it.v ? slashes.replace("b'4", "b'4^"+lyFret(it.v)) : slashes);
    });
    const brk = (i+1)%4===0 && i+1<bars.length ? ' \\break' : '';
    chords.push(cn.join(' ')+' |'); music.push(mu.join(' ')+' |'+brk); rhythm.push(rh.join(' ')+' |'+brk);
  });
  const tempo = opts.bpm ? '\\tempo \\markup { \\concat { \\general-align #Y #DOWN \\smaller \\note {4} #1 " = '+opts.bpm+'  " \\bold "'+(opts.style||'Swing')+'" } }' : '';
  const head = `\\version "2.24.0"
\\paper {
  #(set-paper-size "letter")
  top-margin = 12.5\\mm bottom-margin = 12.5\\mm left-margin = 12.5\\mm right-margin = 12.5\\mm
  indent = 0 ragged-right = ##f ragged-last = ${opts.chart?'##f':'##t'} print-page-number = ##f
  system-system-spacing.basic-distance = #18
  bookTitleMarkup = \\markup \\column {
    \\fill-line { "${opts.part||'Guitar'}" \\column { ${(opts.source||'').split('\n').map(l=>'\\line { "'+l.replace(/"/g,'\\"')+'" }').join(' ')} } }
    \\vspace #2.2 \\fill-line { \\fontsize #6 \\bold "${(opts.title||'').replace(/"/g,'\\"')}" } \\vspace #0.5 }
}
\\header { tagline = ##f }
#(set-global-staff-size 20)
\\layout { \\context { \\Score
  \\override BarNumber.break-visibility = #end-of-line-invisible
  \\override BarNumber.direction = #DOWN \\override BarNumber.self-alignment-X = #LEFT
  \\override BarNumber.font-size = #-2
  barNumberVisibility = #all-bar-numbers-visible } }
`;
  const chordCtx = `\\new ChordNames \\with { majorSevenSymbol = \\markup { "Δ7" } } \\chordmode {\n  ${chords.join('\n  ')}\n}`;
  if(opts.chart){
    return head + `\\score { <<
  ${chordCtx}
  \\new Staff { \\clef treble \\time 4/4 ${tempo} \\improvisationOn
  ${rhythm.join('\n  ')} \\bar "|." }
>> }
`;
  }
  return head + `mus = { \\clef "treble_8" \\time 4/4 ${tempo}
  ${music.join('\n  ')} \\bar "|." }
\\score { <<
  ${chordCtx}
  \\new Staff \\with { \\override StringNumber.stencil = ##f } { \\mus }
  \\new TabStaff \\with { \\override Stem.stencil = ##f \\override Beam.stencil = ##f \\override Dots.stencil = ##f } { \\mus }
>> }
`;
}
function lyDownload(text, filename){
  const blob = new Blob([text], {type:'text/plain'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- state ---------- */
const st = {mode:'study', pc:0, q:'maj7', set:'d2top', scale:'major', inv:0};
const el = id=>document.getElementById(id);

function init(){
  el('roots').innerHTML = ROOTS.map((r,i)=>`<button data-pc="${i}" aria-pressed="${i===0}">${r}</button>`).join('');
  el('roots').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; st.pc=+b.dataset.pc; render(); });
  el('quality').innerHTML = Object.entries(QUAL).map(([k,q])=>`<option value="${k}">${q.name}</option>`).join('');
  el('quality').addEventListener('change', e=>{ st.q=e.target.value; render(); });
  el('scale').addEventListener('change', e=>{ st.scale=e.target.value; render(); });
  el('invPick').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; st.inv=+b.dataset.v; render(); });
  el('sets').innerHTML = SETS.map(s=>`<button data-id="${s.id}" aria-pressed="${s.id===st.set}">${s.name}<small>${s.tag}</small></button>`).join('');
  el('sets').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; st.set=b.dataset.id; render(); });
  el('labels').addEventListener('change', render);
  el('mStudy').addEventListener('click', ()=>setMode('study'));
  el('mKey').addEventListener('click', ()=>setMode('key'));
  el('mQuiz').addEventListener('click', ()=>setMode('quiz'));
  el('next').addEventListener('click', newQ);
  el('lily').addEventListener('click', ()=>{
    const cards=[...el('row').querySelectorAll('.card')];
    const bars=cards.map(c=>[{ch:JSON.parse(c.dataset.chord), v:{notes:JSON.parse(c.dataset.notes)}}]);
    const set=SETS.find(s=>s.id===st.set);
    const title = st.mode==='key' ? (spell(st.pc,st.pc,st.scale)+' '+{major:'major',harm:'harmonic minor',mel:'melodic minor'}[st.scale]+', '+INV[st.inv]) : ROOTS[st.pc]+' '+QUAL[st.q].name+', four inversions';
    lyDownload(lyDocument(bars,{title, part:'Guitar', source:'Flynn, Jazz Guitar Technique Handbook\n'+set.name}), 'inversions.ly'); });
  el('row').addEventListener('click', e=>{ const c=e.target.closest('.card'); if(!c) return; strum(JSON.parse(c.dataset.notes)); });
  el('qDia').addEventListener('click', ()=>{ if(quiz.cur) strum(quiz.cur.v.notes); });
}
function setMode(m){
  st.mode=m; document.body.classList.toggle('quiz-on', m==='quiz');
  ['mStudy','mKey','mQuiz'].forEach((id,i)=>el(id).setAttribute('aria-pressed', ['study','key','quiz'][i]===m));
  document.querySelectorAll('.study-ctl').forEach(x=>x.style.display = m==='study'?'':'none');
  document.querySelectorAll('.key-ctl').forEach(x=>x.style.display = m==='key'?'':'none');
  document.querySelectorAll('.quiz-ctl').forEach(x=>x.style.display = m==='quiz'?'':'none');
  el('rootLbl').textContent = m==='key' ? 'Key' : 'Root';
  if(m==='quiz') newQ(); else render();
}
function syncControls(){
  el('roots').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.pc===st.pc));
  el('sets').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.id===st.set));
  el('invPick').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.v===st.inv));
  el('quality').value=st.q; el('scale').value=st.scale;
}
function card(v, nameHTML, tag, extraCls, ch){
  return `<div class="card ${extraCls||''}" data-notes='${JSON.stringify(v.notes)}' data-chord='${JSON.stringify(ch||{})}' role="button" tabindex="0"><div class="nm">${nameHTML}</div><div class="tag">${tag}</div>${diagram(v, el('labels').checked)}</div>`;
}

function render(){
  syncControls();
  const set = SETS.find(s=>s.id===st.set);
  const labels = el('labels').checked;
  if(st.mode==='study'){
    const q = QUAL[st.q];
    el('title').innerHTML = fmt(ROOTS[st.pc], q.sym);
    el('sub').textContent = set.name+'. The four inversions, lowest position first. The brass dot is the top note.';
    // one position per inversion: lowest playable
    let vs = [0,1,2,3].map(i=>realize(st.pc, st.q, set, i)[0]).filter(Boolean).sort((a,b)=>a.low-b.low);
    // also show the next octave of the first one if it fits, so the cycle is visible
    const first = vs[0]; if(first){ const up = realize(st.pc, st.q, set, first.inv).find(v=>v.low>=first.low+10); if(up) vs = vs.concat([up]); }
    el('row').innerHTML = vs.map(v=>card(v, fmt(ROOTS[st.pc], q.sym), INV[v.inv]+'<br>'+v.bass+' in the bass · '+v.top+' on top', '', {rootName:ROOTS[st.pc], quality:st.q, ext:[]})).join('');
    el('hint').textContent = 'Play them ascending and descending until you can land on any one without thinking. Then take them through the ii-V-I cycles in the Handbook, resolving to the nearest inversion rather than jumping back to root position.';
  } else {
    const chords = diatonic(st.pc, st.scale);
    const scaleName = {major:'major',harm:'harmonic minor',mel:'melodic minor'}[st.scale];
    el('title').innerHTML = spell(st.pc, st.pc, st.scale)+' <span class="q" style="font-size:.7em;vertical-align:0">'+scaleName+'</span>';
    el('sub').textContent = set.name+', holding '+INV[st.inv]+' through every diatonic chord, lowest on the neck first. This is the horizontal harmonic key study from the Handbook (p. 82).';
    let vs = chords.map(c=>{ const v = realize(c.pc, c.q, set, st.inv)[0]; return v ? {v, c} : null; }).filter(Boolean).sort((a,b)=>a.v.low-b.v.low);
    const first = vs[0]; if(first){ const up = realize(first.c.pc, first.c.q, set, st.inv).find(v=>v.low>=first.v.low+10); if(up) vs = vs.concat([{v:up, c:first.c}]); }
    el('row').innerHTML = vs.map(x=>card(x.v, fmt(spell(x.c.pc, st.pc, st.scale), QUAL[x.c.q].sym), x.c.rn+QUAL[x.c.q].sym+'<br>'+x.v.top+' on top', 'rn', {rootName:spell(x.c.pc, st.pc, st.scale), quality:x.c.q, ext:[]})).join('');
    el('hint').textContent = 'Say the roman numeral as you play each one. Then change the inversion and do it again; the chords stay in the same order but the whole ladder shifts.';
  }
}

/* ---------- quiz ---------- */
const quiz = {cur:null, streak:0, best:0};
const rnd = a=>a[Math.floor(Math.random()*a.length)];
function newQ(){
  const anySet = el('anySet').checked;
  const set = anySet ? rnd(SETS) : SETS.find(s=>s.id===st.set);
  const q = rnd(Object.keys(QUAL));
  const pc = Math.floor(Math.random()*12);
  const inv = Math.floor(Math.random()*4);
  const poss = realize(pc, q, set, inv);
  if(!poss.length) return newQ();
  const v = rnd(poss);
  const type = rnd(['inv','top','bass']);
  let text, choices, answer;
  if(type==='inv'){ text='Which inversion is this?'; choices=INV.slice(); answer=INV[inv]; }
  else if(type==='top'){ text='Which chord tone is on top?'; choices=QUAL[q].tones.slice(); answer=v.top; }
  else { text='Which chord tone is in the bass?'; choices=QUAL[q].tones.slice(); answer=v.bass; }
  quiz.cur = {v, set, q, pc, text, choices, answer, done:false};
  el('qTitle').innerHTML = fmt(ROOTS[pc], QUAL[q].sym);
  el('qText').textContent = set.name+'. '+text+' Click the diagram to hear it.';
  el('qDia').innerHTML = diagram(v, false, 220);
  el('choices').innerHTML = choices.map(c=>`<button data-c="${c}">${c}</button>`).join('');
  el('choices').querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>answerQ(b)));
  el('score').textContent = 'Streak '+quiz.streak+(quiz.best?' · best '+quiz.best:'');
}
function answerQ(b){
  const c = quiz.cur; if(c.done) return; c.done=true;
  const right = b.dataset.c===c.answer;
  if(right){ quiz.streak++; quiz.best=Math.max(quiz.best,quiz.streak); } else quiz.streak=0;
  el('choices').querySelectorAll('button').forEach(x=>{ if(x.dataset.c===c.answer) x.classList.add('right'); else if(x===b) x.classList.add('wrong'); });
  el('qDia').innerHTML = diagram(c.v, true, 220);
  el('qText').textContent = INV[c.v.inv]+': '+c.v.bass+' in the bass, '+c.v.top+' on top.';
  el('score').textContent = 'Streak '+quiz.streak+(quiz.best?' · best '+quiz.best:'');
}

init(); render();
</script>
